<section class="expense-section">
    <h2>Add Expense</h2>

    <form id="expenseForm">
        <input
            type="text"
            id="expenseName"
            placeholder="Expense name"
            required
        >

        <input
            type="number"
            id="expenseAmount"
            placeholder="Amount"
            required
        >

        <select id="expenseCategory" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Add Expense</button>
    </form>
</section>

<section class="dashboard-summary">
    <h2>Budget Summary</h2>
    <p>Budget: KES <span id="budgetDisplay">0</span></p>
    <p>Total Expenses: KES <span id="expenseDisplay">0</span></p>
    <p>Remaining Balance: KES <span id="balanceDisplay">0</span></p>
    <p id="budgetMessage"></p>
</section>

<section class="expenses">
    <h2>Your Expenses</h2>

    <ul id="expenseList">
        <!-- JavaScript will add expenses here -->
    </ul>
</section>

<script src="script.js"></script>
